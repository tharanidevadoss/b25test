<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Commerce Landing Page</title>

  <!-- Minimal CSS -->
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      background: url('https://images.unsplash.com/photo-1523275335684-37898b6baf30') center/cover no-repeat;
      color: white;
      padding: 80px 20px;
      text-align: center;
    }

    nav {
      background: #000;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 150px;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      padding: 30px;
    }

    section {
      margin-bottom: 30px;
    }

    .products {
      display: flex;
      gap: 20px;
    }

    article {
      border: 1px solid #ddd;
      padding: 15px;
      width: 250px;
      text-align: center;
    }

    .btn {
      margin: 5px;
      padding: 8px 12px;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    .cart {
      background: #ff9800;
      color: #fff;
    }

    .buy {
      background: #4caf50;
      color: #fff;
    }

    article img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    aside {
      background: #f4f4f4;
      padding: 15px;
    }

    footer {
      background: #000;
      color: white;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>
<body>

  <!-- Header / Hero Section -->
  <header>
    <h1>ShopEase</h1>
    <p>Your one-stop online shopping destination</p>
  </header>

  <!-- Navigation -->
  <nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Offers</a>
    <a href="#">Contact</a>
  </nav>

  <!-- Main Content -->
  <main>

    <!-- Products Section -->
    <section>
      <h2>Featured Products</h2>
      <div class="products">

        <article>
          <img src="https://images.unsplash.com/photo-1519744792095-2f2205e87b6f" alt="Product 1" />
          <h3>Smart Watch</h3>
          <p>₹2,999</p>
          <button class="btn cart">Add to Cart</button>
          <button class="btn buy">Buy Now</button>
        </article>

        <article>
          <img src="https://images.unsplash.com/photo-1512499617640-c2f999018b72" alt="Product 2" />
          <h3>Headphones</h3>
          <p>₹1,499</p>
          <button class="btn cart">Add to Cart</button>
          <button class="btn buy">Buy Now</button>
        </article>

        <article>
          <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f" alt="Product 3" />
          <h3>Camera</h3>
          <p>₹18,999</p>
          <button class="btn cart">Add to Cart</button>
          <button class="btn buy">Buy Now</button>
        </article>

      </div>
    </section>

    <!-- Aside Section -->
    <aside>
      <h3>Special Offer</h3>
      <p>Get up to 50% OFF on selected items!</p>
    </aside>

  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 ShopEase. All Rights Reserved.</p>
  </footer>

</body>
</html>
